[package]
name = "can-monitor-tauri"
version = "0.1.3"
description = "CAN Monitor — 跨平台桌面 GUI (Tauri v2)"
edition = "2021"

[lib]
name = "can_monitor_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
can-types = { path = "../crates/can-types" }
can-monitor-core = { path = "../crates/can-monitor-core" }
can-socketcan = { path = "../crates/can-socketcan" }
can-usbvci = { path = "../crates/can-usbvci" }
can-devices = { path = "../crates/can-devices" }
crossbeam-channel = "0.5"

# 独立 workspace: 不隶属于根 workspace (根 workspace 的 profile/成员会干扰 tauri-cli 的 cargo metadata);
# 通过 path 依赖引用 ../crates/* (它们属于根 workspace, 作为外部包构建无冲突)。
[workspace]
