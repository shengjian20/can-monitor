[package]
name = "can-server"
version = "0.1.0"
edition = "2021"
description = "CAN 监控 Web 服务 (axum HTTP + WebSocket 批量帧流)"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
can-monitor-core = { path = "../can-monitor-core" }
can-types = { path = "../can-types" }

# can-devices 由 T16 (REST 设备列表 / send / start / stop) 接入, 本任务不需要。

[dev-dependencies]
tokio-tungstenite = "0.30"
futures-util = "0.3"
canopen-stack = { path = "../canopen-stack" }
j1939-stack = { path = "../j1939-stack" }
