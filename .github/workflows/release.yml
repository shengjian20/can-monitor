# Release workflow: 打 tag (v*) 或手动触发 → Tauri 构建 → 上传 GitHub Releases artifacts
#
# 重要说明 (容错): 本 workflow 依赖 T17 (src-tauri/) 与 T18 (web/) 合入后的仓库结构。
# 当前这两个目录尚不存在 — tag 触发 (v*) 时它们必然已合入, 构建正常; 在此之前只有
# workflow_dispatch 能手动跑到, 此时 hashFiles 守卫会跳过对应步骤, 不打假成功也不报错混淆。

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: publish (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # tauri-action 需要创建/更新 GitHub Release 并上传产物 → contents: write
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm: GitHub 公共仓库免费提供的原生 arm64 (aarch64) runner
        # (public preview), 与 x86_64 的 ubuntu-latest 各出一套 AppImage/deb。
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest]
        # macOS 不在发布矩阵: Tauri v2 的 macOS 产物 (dmg/app) 走签名/公证流程需要
        # Apple 开发者证书 (APPLE_ID / APPLE_CERTIFICATE 等 secrets), 本项目未配置。
        # 如需发布 dmg: os 列表加一行 `- os: macos-latest` 并按 Tauri 官方文档配置签名 secrets。
    env:
      # --- Tauri v2 关键环境变量 ---
      # NO_STRIP: AppImage 构建必须置 true — 若 strip 二进制, 产物会带 .relr.dyn section,
      #           AppImage 打包工具解析失败 (Tauri 官方已知问题)
      NO_STRIP: "true"
      # WEBKIT_DISABLE_DMABUF_RENDERER: 规避 WebKitGTK 在无 GPU / 容器环境
      #           (GitHub runner 常见) 下的 EGL/DMABUF 渲染崩溃, 强制软件渲染
      WEBKIT_DISABLE_DMABUF_RENDERER: "1"

    steps:
      - uses: actions/checkout@v7

      # Node 22 (LTS): Tauri 2.11.x 支持 Node 20/22 LTS, 与 ci.yml 保持同款 action 版本
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      # 缓存 cargo registry + target; 与 ci.yml 同款 (workspaces 同时列根 workspace 与 src-tauri)
      # rust-cache 对缺失 workspace 目录只打错误不 fail (T8 已核实), 此处 src-tauri 尚可缺失
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            ./src-tauri -> target

      # Tauri v2 的 Linux 系统依赖 (注意是 libwebkit2gtk-4.1, 与 Tauri v1 的 4.0 不同)
      # patchelf + xdg-utils 为 Tauri 官方推荐的 AppImage bundling 依赖
      # startsWith(ubuntu) 覆盖 ubuntu-latest (x86_64) 与 ubuntu-24.04-arm (aarch64)
      - name: Install Linux system deps (Tauri v2)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      # 前端构建: web/ 由 T18 创建 (Vite + TS, npm ci 需要 package-lock.json)
      # hashFiles 容错: web/ 尚不存在时跳过本步
      - name: Build frontend (web/)
        if: ${{ hashFiles('web/package-lock.json') != '' }}
        run: |
          npm --prefix web ci
          npm --prefix web run build

      # 构建并发布: tauri-action 在 tagName 指定的 release (不存在则自动创建) 上自动上传
      # bundle 产物 (Linux: AppImage + deb; Windows: MSI + NSIS), 无需额外 upload 步骤。
      # 若改为显式 glob 上传 (不使用 tauri-action 自动上传), 可追加
      #   softprops/action-gh-release@v2
      #   with: files: 'src-tauri/target/release/bundle/**/*'   # tauri 实际产物目录
      # hashFiles 容错: src-tauri 缺失时跳过 (预期行为, tag 触发时已存在)
      - name: Build & publish (tauri-action)
        if: ${{ hashFiles('src-tauri/tauri.conf.json') != '' }}
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # 非根目录布局: tauri 工程在 src-tauri/ (T17 创建)
          projectPath: './src-tauri'
          # tag 触发时 github.ref_name = vX.Y.Z, 直接作为 release tag/name
          # (workflow_dispatch 时 ref_name 是当前分支名, 仅用于手动试跑)
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: |
            Automated release build for can-monitor.
            Download the asset matching your platform and install.
          releaseDraft: true
          prerelease: false
          args: --verbose

  # CLI/Web 形态发布资产: 每个平台构建 can-monitor 二进制 (CLI+TUI+Web 一体),
  # 打包 (含厂商库 + web/dist + 简短 README) 并上传到 publish 创建的同一个 draft release。
  # 依赖 publish: 等 tauri-action 把 release 建出来后再向它追加资产。
  cli-web:
    name: cli-web (${{ matrix.os }})
    needs: publish
    runs-on: ${{ matrix.os }}
    # gh release upload 需要向既有 release 追加资产 → contents: write
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # 平台后缀与厂商库来源: 与 publish 同款三平台 (ubuntu-latest → x86_64,
        # ubuntu-24.04-arm → aarch64, windows-latest → x86_64)。include 按 os 合并附加键。
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest]
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            vendor_lib: third_party/controlcan/x86_64/libcontrolcan.so
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
            vendor_lib: third_party/controlcan/aarch64/libcontrolcan.so
          - os: windows-latest
            platform: windows-x86_64
            vendor_lib: third_party/controlcan/win64/ControlCAN.dll
    env:
      # gh 上传用 token (与 secrets.GITHUB_TOKEN 等价)
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      # Node 22 (LTS): 与 publish job / ci.yml 同款; 产出 web/dist 供二进制 Web 形态托管
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # 缓存 cargo registry + target (can-monitor release 构建全依赖链, 缓存收益大)
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      # 前端构建: web/dist 由 can-monitor 二进制按 CWD 相对解析 (静态托管来源)
      - name: Build frontend (web/)
        run: |
          npm --prefix web ci
          npm --prefix web run build

      # 构建 CLI+TUI+Web 一体二进制 (workspace [profile.release]: lto + strip)
      # 厂商库走运行时 dlopen (T10), 构建期不链接 → 无需特殊依赖
      - name: Build can-monitor binary (release)
        run: cargo build --release -p can-monitor

      # ---- Linux (x86_64 / aarch64): 组装目录 → tar.gz ----
      - name: Package (Linux tar.gz)
        if: startsWith(matrix.os, 'ubuntu')
        shell: bash
        run: |
          set -euxo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          PLAT="${{ matrix.platform }}"
          ASSET="can-monitor-${VERSION}-${PLAT}.tar.gz"
          STAGE="staging/can-monitor-${VERSION}-${PLAT}"
          mkdir -p "${STAGE}"
          cp target/release/can-monitor "${STAGE}/can-monitor"
          # 厂商库放二进制同目录 → 加载器 exe 同目录优先, 开箱即用
          cp "${{ matrix.vendor_lib }}" "${STAGE}/libcontrolcan.so"
          cp -r web/dist "${STAGE}/web"
          {
            printf '%s\n' '# can-monitor (CLI + TUI + Web)' '' \
              '一体二进制: TUI 终端监控 / Web 浏览器界面 / CLI 命令, 无需安装。' '' \
              '用法:' \
              '  ./can-monitor --help' \
              '  ./can-monitor --backend none --web-write   # TUI + Web 界面 (http://127.0.0.1:8080)' \
              '  ./can-monitor --backend socketcan --iface can0' \
              '  ./can-monitor --backend usbvci             # USB-CAN, 厂商库 libcontrolcan.so 已在本目录' '' \
              '提示: Web 静态文件按当前工作目录相对 web/dist 解析, 请在解压后的目录内运行。'
          } > "${STAGE}/README.md"
          tar -C staging -czf "${ASSET}" "can-monitor-${VERSION}-${PLAT}"
          ls -lh "${ASSET}"

      # ---- Windows: 组装目录 → zip (PowerShell Compress-Archive) ----
      - name: Package (Windows zip)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $platform = "${{ matrix.platform }}"
          $asset = "can-monitor-${version}-${platform}.zip"
          $stage = "staging\can-monitor-${version}-${platform}"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target\release\can-monitor.exe" "$stage\can-monitor.exe"
          # 厂商库放二进制同目录 → 加载器 exe 同目录优先, 开箱即用
          Copy-Item "${{ matrix.vendor_lib }}" "$stage\ControlCAN.dll"
          Copy-Item -Recurse "web\dist" "$stage\web"
          $readmeLines = @(
            '# can-monitor (CLI + TUI + Web)'
            ''
            '一体二进制: TUI 终端监控 / Web 浏览器界面 / CLI 命令, 无需安装。'
            ''
            '用法:'
            '  .\can-monitor.exe --help'
            '  .\can-monitor.exe --backend none --web-write   # TUI + Web 界面 (http://127.0.0.1:8080)'
            '  .\can-monitor.exe --backend socketcan --iface can0'
            '  .\can-monitor.exe --backend usbvci             # USB-CAN, 厂商库 ControlCAN.dll 已在本目录'
            ''
            '提示: Web 静态文件按当前工作目录相对 web/dist 解析, 请在解压后的目录内运行。'
          )
          Set-Content -Path "$stage\README.md" -Value ($readmeLines -join "`n") -Encoding UTF8
          Compress-Archive -Path $stage -DestinationPath $asset
          Get-Item $asset | Select-Object Name, Length

      # 上传到 publish 创建的同一 release (draft 亦可上传); --clobber 允许重跑覆盖
      - name: Upload assets to release
        shell: bash
        run: |
          set -euxo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          PLAT="${{ matrix.platform }}"
          if [[ "${PLAT}" == windows-* ]]; then EXT="zip"; else EXT="tar.gz"; fi
          ASSET="can-monitor-${VERSION}-${PLAT}.${EXT}"
          gh release upload "${{ github.ref_name }}" "${ASSET}" --clobber
